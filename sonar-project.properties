# Análisis estático con SonarQube local (http://localhost:9000)
sonar.projectKey=precona-automatizaciones
sonar.projectName=precona.com.ar - Automatizaciones
sonar.sources=backend/precona,sitio/src
sonar.tests=backend/tests,sitio/tests
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12
# Reportes de cobertura generados por las pruebas
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=sitio/coverage/lcov.info
